name: CI

on:
  push:
  pull_request:

# A new push supersedes the previous run on the same branch. Free accounts get
# few macOS runners, so piled-up runs would otherwise wait and get cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: uv run pytest -q
      - name: CLI smoke test
        run: |
          uv run phonnect --help
          uv run phonnect status || true
      - name: Tool install from source
        run: |
          uv tool install .
          uv tool list
