name: Release

# Push a tag like v0.4.0 (`just release 0.4.0` does it) to build the package and publish
# a GitHub Release with the wheel, the source archive and the installer scripts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Tests and build run with a read-only token; only the publish job can write.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.13"

      - name: Check the tag matches the package version
        id: version
        run: |
          version="$(uv run --quiet python -c 'import phonnect; print(phonnect.__version__)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: uv run pytest -q

      - name: Build wheel and sdist
        run: uv build

      - name: Installer scripts, set to install this release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed "s/^DEFAULT_VERSION=\"\"/DEFAULT_VERSION=\"$VERSION\"/" scripts/install.sh > dist/install.sh
          sed "s/\$DefaultVersion = \"\"/\$DefaultVersion = \"$VERSION\"/" scripts/install.ps1 > dist/install.ps1
          cp scripts/uninstall.sh scripts/uninstall.ps1 dist/
          grep -q "^DEFAULT_VERSION=\"$VERSION\"" dist/install.sh
          grep -q "\$DefaultVersion = \"$VERSION\"" dist/install.ps1
          sh -n dist/install.sh
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the release
      id-token: write  # build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      # Lets anyone check a download came from this workflow: gh attestation verify <file> --repo 3sztof/phonnect
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Install or update

          **macOS / Linux** (in a terminal):

          \`\`\`sh
          curl -fsSL ${base}/install.sh | sh
          \`\`\`

          **Windows** (in PowerShell):

          \`\`\`powershell
          irm ${base}/install.ps1 | iex
          \`\`\`

          The installer shows what it will install and where, and asks before installing uv, scrcpy or adb.
          Already installed? Use **Update Phonnect** in the tray menu, or run \`phonnect update\`.

          By hand, with [uv](https://docs.astral.sh/uv/): \`uv tool install --force --python ">=3.11" ${base}/phonnect-${VERSION}-py3-none-any.whl\`, then \`phonnect install\`.

          Check that a file came from this release's build: \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Phonnect $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --verify-tag
