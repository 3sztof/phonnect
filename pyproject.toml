[project]
name = "phonnect"
dynamic = ["version"]
description = "Open scrcpy automatically when an Android device connects over USB or Wi-Fi, with a tray icon."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Krzysztof" }]
dependencies = [
    "pystray>=0.19.5",
    "Pillow>=13.0",
    "darkdetect>=0.8",
    "segno>=1.6",
    "sv-ttk>=2.6; sys_platform == 'win32'",
    # The tray hands UI updates to the main thread with PyObjCTools.AppHelper (pystray pulls it in too).
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]
classifiers = [
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/3sztof/phonnect"

[project.scripts]
phonnect = "phonnect.cli:main"

# GUI entry point: on Windows this launcher has no console window.
[project.gui-scripts]
phonnect-tray = "phonnect.cli:tray_main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/phonnect/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/phonnect"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear, simplify
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "SIM105",  # try/except/pass reads clearer than contextlib.suppress here
    "SIM108",  # ternaries aren't always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "E501"]  # small lambdas as fakes; real adb output as test data
