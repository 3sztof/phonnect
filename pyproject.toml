[project]
name = "scrcpy-autolaunch"
dynamic = ["version"]
description = "Open scrcpy automatically when an Android device connects over USB or Wi-Fi, with a tray icon."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Krzysztof" }]
dependencies = [
    "pystray>=0.19.5",
    "Pillow>=13.0",
]
classifiers = [
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/3sztof/scrcpy-autolaunch"

[project.scripts]
scrcpy-autolaunch = "scrcpy_autolaunch.cli:main"

# GUI entry point: on Windows this launcher has no console window.
[project.gui-scripts]
scrcpy-autolaunch-tray = "scrcpy_autolaunch.cli:tray_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/scrcpy_autolaunch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scrcpy_autolaunch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
